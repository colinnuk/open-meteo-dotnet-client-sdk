name: determine version

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop
    types:
      - closed
    paths:
      - '**/*.cs'
      - '**/*.csproj'
  push:
    branches:
      - master
      - develop
      - '*'
    paths:
      - '**/*.cs'
      - '**/*.csproj'
    tags:
      - "v*"
  

env:
  GIT_BRANCH: 'master'

jobs:
  determine:
    runs-on: ubuntu-latest

    steps:
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
          versionSpec: '5.x'

    - name: Check out Code 
      uses: actions/checkout@v6
      with:
          fetch-depth: 0

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4
      with:
          useConfigFile: true
          configFilePath: ./.github/gitversion.yml
    
    - name: Print Version
      run: echo ${{ steps.gitversion.outputs.FullSemVer }}
